<html>
<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide.min.css"/>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
	<link rel="stylesheet" href="participante.css">
	
	<style>
        .form-control {
            margin-bottom: 5px; /* Ajusta o espaçamento inferior */
        }
        td {
            padding: 5px; /* Ajusta o espaçamento das células */
        }
        
         #outrosTexto {
            display: none;
            margin-top: 10px; }
            
        #aumentar {
    margin-top: 20px; /* Adiciona margem acima da div */
    
}

#tabelaRegistros3 {
    width: 100%;
  }

  /* Garante que os textareas ocupem toda a largura da célula e não se redimensionem horizontalmente */
  #tabelaRegistros3 .form-control.textarea-fixed-size {
    width: 100%;
    resize: vertical; /* Permite redimensionamento apenas vertical */
  }

  /* Ajusta as colunas específicas para a tabela com o ID 'tabelaRegistros3' */
  #tabelaRegistros3 th.col-md-3,
  #tabelaRegistros3 td.col-md-3 {
    width: 25%; /* Aproximadamente 3 colunas do grid de 12 */
  }

  #tabelaRegistros3 th.col-md-4,
  #tabelaRegistros3 td.col-md-4 {
    width: 33.3333%; /* Aproximadamente 4 colunas do grid de 12 */
  }

  #tabelaRegistros3 th.col-md-1,
  #tabelaRegistros3 td.col-md-1 {
    width: 8.3333%; /* Aproximadamente 1 coluna do grid de 12 */
  }
  
  .textarea-fixed-size {
            width: 100%; /* Faz o textarea ocupar toda a largura da célula */
            height: 50px; /* Define a altura do textarea */
            min-height: 50px;
            box-sizing: border-box; /* Inclui padding e border no tamanho total */
            resize: vertical; /* Permite apenas redimensionar verticalmente */
            white-space: pre-wrap; /* Permite quebra de linha e preserva espaços */
            word-wrap: break-word;
        }
        /* Configurações para a tabela e células */
        .table {
            table-layout: fixed; /* Garante que a tabela tenha um layout fixo */
            width: 100%; /* Faz a tabela ocupar toda a largura disponível */
        }
        .table td, .table th {
            vertical-align: top; /* Alinha o conteúdo no topo das células */
            padding: 8px; /* Adiciona espaçamento interno nas células */
        }
        .table textarea {
            overflow: auto; /* Adiciona rolagem se o conteúdo exceder a altura definida */
        }
        }
        
        
    </style>
</head>

<div class="fluig-style-guide">
<form name="form" role="form">

		</div></br></br>

    <input type="hidden" id="nomesData" name="nomesData">
		
		</br></br></br><div class="form-group col-md-4">

		        <label><input type="checkbox" name="brigada">Brigada de Incêndio</label></br>
		        <label><input type="checkbox" name="revisao">Revisão do planejamento estratégico</label></br>

		    </div>
		</div>

</div>
