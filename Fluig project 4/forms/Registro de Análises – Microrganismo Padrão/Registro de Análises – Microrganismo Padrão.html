<script>
        function preencherDataHoraAtual() {
            var dataAtual = new Date();

            // Formatação da data no padrão brasileiro
            var ano = dataAtual.getFullYear();
            var mes = String(dataAtual.getMonth() + 1).padStart(2, '0'); // Meses começam em 0
            var dia = String(dataAtual.getDate()).padStart(2, '0');
            
            // Formatação da hora
            var hora = String(dataAtual.getHours()).padStart(2, '0');
            var minutos = String(dataAtual.getMinutes()).padStart(2, '0');

            // Formato 'DD/MM/YYYY HH:mm' para data e hora
            var dataHoraFormatada = `${dia}/${mes}/${ano} ${hora}:${minutos}`;
            console.log("Data e Hora formatada:", dataHoraFormatada); // Verifica a data e hora formatadas

            // Preencher o campo de data e hora de início se estiver vazio
            if (document.getElementById("panelwarning2").style.display !== "none") {
                var campoDataInicio = document.getElementById("datacainicio2");
                console.log("Campo Data de Início:", campoDataInicio); // Verifica o campo
                if (!campoDataInicio.value) {
                    campoDataInicio.value = dataHoraFormatada; // Preenche com a data e hora atual
                }
            }
            
            // Preencher os campos de data e hora final e data apenas se estiverem vazios
            if (document.getElementById("panelwarning3").style.display !== "none") {
                var campoDataFinal = document.getElementById("datacafinall");
                console.log("Campo Data Final:", campoDataFinal); // Verifica o campo
                if (!campoDataFinal.value) {
                    campoDataFinal.value = dataHoraFormatada; // Preenche apenas com a data e hora
                }

                var campoDataCalendario = document.getElementById("datacalendario");
                console.log("Campo Data Calendário:", campoDataCalendario); // Verifica o campo
                if (!campoDataCalendario.value) {
                    campoDataCalendario.value = `${dia}/${mes}/${ano}`; // Preenche apenas com a data
                }
            }
        }

        // Chama a função ao carregar a página
        window.onload = function() {
            console.log("Função preencherDataHoraAtual chamada."); // Verifica se a função é chamada
            preencherDataHoraAtual();
        };
    </script>
