<script>
    function preencherDataAtual() {
        var dataAtual = new Date();
        
        // Formatação da data e hora no padrão brasileiro
        var ano = dataAtual.getFullYear();
        var mes = String(dataAtual.getMonth() + 1).padStart(2, '0'); // Meses começam em 0
        var dia = String(dataAtual.getDate()).padStart(2, '0');
        var horas = String(dataAtual.getHours()).padStart(2, '0');
        var minutos = String(dataAtual.getMinutes()).padStart(2, '0');
        
        // Formato 'DD/MM/YYYY HH:mm' para texto
        var dataFormatada = `${dia}/${mes}/${ano} ${horas}:${minutos}`; 

        // Preencher os campos se estiverem vazios
        if (document.getElementById("panel1").style.display !== "none") {
            var campoDataInicio = document.getElementById("data_inicio_esterilidade");
            if (campoDataInicio && !campoDataInicio.value) { // Verifica se o campo está vazio
                campoDataInicio.value = dataFormatada; // Preenche com a data atual
            }
        }
        
        if (document.getElementById("panel2").style.display !== "none") {
            var campoDataInicio2 = document.getElementById("datainicio2");
            if (campoDataInicio2 && !campoDataInicio2.value) {
                campoDataInicio2.value = dataFormatada;
            }

            var campoDataFinal = document.getElementById("data_final_esterilidade");
            if (campoDataFinal && !campoDataFinal.value) {
                campoDataFinal.value = dataFormatada;
            }
        }

        // Preencher o campo 'datacalendario' independentemente dos painéis
        var campoDataCalendario = document.getElementById("datacalendario");
        if (campoDataCalendario && !campoDataCalendario.value) {
            campoDataCalendario.value = dataFormatada;
        }
    }

    // Chama a função ao carregar a página
    window.onload = function() {
        preencherDataAtual();
    };
</script>
