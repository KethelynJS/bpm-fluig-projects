<script>
    function preencherDataAtual() {
        var dataAtual = new Date();
        var ano = dataAtual.getFullYear();
        var mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
        var dia = String(dataAtual.getDate()).padStart(2, '0');
        var horas = String(dataAtual.getHours()).padStart(2, '0');
        var minutos = String(dataAtual.getMinutes()).padStart(2, '0');
        var dataFormatada = `${dia}/${mes}/${ano} ${horas}:${minutos}`;

        // Painel 1 - Preencher data_solicitacao
        var panel1 = document.getElementById("panel1");
        var campoDataInicio = document.getElementById("data_solicitacao");
        if (panel1 && campoDataInicio && panel1.style.display !== "none" && !campoDataInicio.value) {
            campoDataInicio.value = dataFormatada;
        }

        // Painel 2 - Preencher data_solicitacao2
        var panel2 = document.getElementById("panel2");
        var campoDataInicio2 = document.getElementById("data_solicitacao2");
        if (panel2 && campoDataInicio2 && panel2.style.display !== "none" && !campoDataInicio2.value) {
            campoDataInicio2.value = dataFormatada;
        }

        // Painel 3 - Preencher data_conclusao
        var panel3 = document.getElementById("panel3");
        var campoDataFinal = document.getElementById("data_conclusao");
        if (panel3 && campoDataFinal && panel3.style.display !== "none" && !campoDataFinal.value) {
            campoDataFinal.value = dataFormatada;
        }
    }

    // Chamar a função ao carregar a página
    document.addEventListener("DOMContentLoaded", function() {
        preencherDataAtual();
    });

    // Se os painéis forem ativados dinamicamente, chamar a função quando forem exibidos
    function mostrarPainel(idPainel) {
        var painel = document.getElementById(idPainel);
        if (painel) {
            painel.style.display = "block";
            preencherDataAtual(); // Chama a função para preencher a data quando o painel for exibido
        }
    }
</script>
