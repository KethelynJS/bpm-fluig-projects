<html>
<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide.min.css"/>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
</head>
<body>
<div class="fluig-style-guide">
<form name="form" role="form">

<div id="panelx" class="panel panel-primary">
    <div class="panel-heading">
        <h3 class="panel-title">Verificação</h3>
    </div>
    <div class="panel-body">
    <div class="row">
		    <div id="opcaoo" class="form-group col-md-4">
		  <label for="setor">Setor:</label>
		    <select type="opcao" name="setor" class="form-control" id="setor" placeholder="Escreva o seu nome">
		      <option value="opcao1">Equipamentos</option>
		    </select>
		    </div>
		    <div id="opcaoo" class="form-group col-md-4">
		    <label for="descricao">Descrição do equipamento:</label>
		    <select type="opcao" name="descricao" class="form-control" id="descricao" placeholder="Escreva o seu nome">
		      <option value="opcao1">Gerador de energia de emergência</option>
		    </select>
		</div>
		<div id="opcaoo" class="form-group col-md-4">
		    <label for="indentificacao">Identificação:</label>
		    <select type="opcao" name="indentificacao" class="form-control" id="indentificacao" placeholder="Escreva o seu nome">
		      <option value="opcao1">IMOB00209</option>
		    </select>
		</div>
		</div>
		<div class="row">
		<div id="opcaoo" class="form-group col-md-4">
		    <label for="localizacao">Localização:</label>
		    <select type="opcao" name="localizacao" class="form-control" id="localizacao" placeholder="Escreva o seu nome">
		      <option value="opcao1"> Área externa - Em frente a Expedição</option>
		    </select>
		</div>
		<div class="form-group col-md-2">
		    <label for="procedencia">N° Solicitação Fluig</label>
		    <input type="text" id="numeroSolicitacao" name="numeroSolicitacao" class="form-control" readonly>
		</div>
		<div class="row">
		    <div class="form-group col-md-2">
		        <label for="data_envio">Data</label>
		        <input type="text" name="data_envio" id="data_envio" class="form-control" placeholder="Data">
		    </div>
		</div>
		</div>
    
    
	    <div class="row">
	    <div class="form-group col-md-10">
	    <label>1 - Verificar no painel digital se a chave branca OPERAÇÃO MANUAL/AUTO está na posição 2 (AUTO)</label>
	        <div class="radio">
	            <label><input type="radio" name="chave_branca" id="chave_branca" value="Sim_1">Sim</label></br>
	            <label><input type="radio" name="chave_branca" id="chave_branca" value="Nao_1">Não. Nesse caso usar o botão modo para direita ou esquerda</label>
	        </div>		
	    </div>
		</div>
		<div class="row">
	    <div class="form-group col-md-6">
	    <label>2 - O painel digital de controle se está na posição AUT ?</label>
	        <div class="radio">
	            <label><input type="radio" name="posicao_AUT" id="posicao_AUT" value="Sim_2">Sim</label></br>
	            <label><input type="radio" name="posicao_AUT" id="posicao_AUT" value="nao_2">Não. Nesse caso usar o botão modo para direita ou esquerda</label>
	        </div>		
	    </div>
		</div>
		<div class="row">
	    <div class="form-group col-md-6">
	    <label>3 -  Verificar logo abaixo do painel digital se a lâmpada LIGA/DESL CARGA está acesa</label>
	        <div class="radio">
	            <label><input type="radio" name="painel_digital_lampada" id="painel_digital_lampada" value="sim_3">Sim</label></br>
	            <label><input type="radio" name="painel_digital_lampada" id="painel_digital_lampada" value="nao_3">Não</label>
	        </div>		
	    </div>
		</div>
		<div class="row">
	    <div class="form-group col-md-6">
	    <label>4. Verificar nível de combustível: Está acima de ½ tanque?</label>
	        <div class="radio">
	            <label><input type="radio" name="combustivel" id="combustivel" value="sim_4">Sim</label></br>
	            <label><input type="radio" name="combustivel" id="combustivel" value="nao_4">Não. Solicitar a compra do combustível</label>
	        </div>		
	    </div>
		</div>
		<div class="row">
		    <div class="form-group col-md-6">
		    <label>Conclusão Final da Verificação</label>
		        <div class="radio">
		            <label><input type="radio" name="verificacao" id="verificacao" value="conforme">Conforme</label></br>
		            <label><input type="radio" name="verificacao" id="verificacao" value="nao_conforme">Não conforme</label> <input type="text" name="descricao_outros_acao" id="descricao_outros_acao" style="display: inline-block; width: 250px; border: none; border-bottom: 1px solid #000; background: none; outline: none; height: 20px;" placeholder="Descrever nº Solicitação Manutenção Fluig">
		        </div>		
		    </div>
		</div>
    </div>
</div>



</form>
</div>
<script>
    window.onload = function() {
        var today = new Date();
        var day = String(today.getDate()).padStart(2, '0');
        var month = String(today.getMonth() + 1).padStart(2, '0'); // Janeiro é 0!
        var year = today.getFullYear();

        var currentDate = day + '/' + month + '/' + year; // Formato DD/MM/YYYY

        // Define o valor do campo com id "data_envio"
        document.getElementById("data_envio").value = currentDate;
    };
</script>
</body>
</html>
